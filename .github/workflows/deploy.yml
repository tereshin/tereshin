name: Deploy to DEV

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEV_HOST: ${{ secrets.DEV_HOST }}
      DEV_USER: ${{ secrets.DEV_USER }}
      DEV_PASSWORD: ${{ secrets.DEV_PASSWORD }}
      LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "${DEV_HOST}"
          test -n "${DEV_USER}"
          test -n "${DEV_PASSWORD}"
          test -n "${LETSENCRYPT_EMAIL}"

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Upload deployment files
        run: |
          sshpass -p "${DEV_PASSWORD}" ssh -o StrictHostKeyChecking=no "${DEV_USER}@${DEV_HOST}" "mkdir -p /opt/vozacki/traefik"
          sshpass -p "${DEV_PASSWORD}" scp -o StrictHostKeyChecking=no deploy/docker-compose.yml "${DEV_USER}@${DEV_HOST}:/opt/vozacki/docker-compose.yml"
          sshpass -p "${DEV_PASSWORD}" scp -o StrictHostKeyChecking=no deploy/traefik/traefik.yml "${DEV_USER}@${DEV_HOST}:/opt/vozacki/traefik/traefik.yml"
          sshpass -p "${DEV_PASSWORD}" ssh -o StrictHostKeyChecking=no "${DEV_USER}@${DEV_HOST}" "cat > /opt/vozacki/.env <<'EOF'
          LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
          EOF"

      - name: Run remote deploy
        run: |
          sshpass -p "${DEV_PASSWORD}" scp -o StrictHostKeyChecking=no scripts/deploy-remote.sh "${DEV_USER}@${DEV_HOST}:/tmp/deploy-remote.sh"
          sshpass -p "${DEV_PASSWORD}" ssh -o StrictHostKeyChecking=no "${DEV_USER}@${DEV_HOST}" "chmod +x /tmp/deploy-remote.sh && /tmp/deploy-remote.sh /opt/vozacki"
