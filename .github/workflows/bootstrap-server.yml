name: Bootstrap DEV server

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      DEV_HOST: ${{ secrets.DEV_HOST }}
      DEV_USER: ${{ secrets.DEV_USER }}
      DEV_PASSWORD: ${{ secrets.DEV_PASSWORD }}
      DEV_SSH_PUBLIC_KEY: ${{ secrets.DEV_SSH_PUBLIC_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "${DEV_HOST}"
          test -n "${DEV_USER}"
          test -n "${DEV_PASSWORD}"
          test -n "${DEV_SSH_PUBLIC_KEY}"

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Upload bootstrap script
        run: |
          sshpass -p "${DEV_PASSWORD}" scp -o StrictHostKeyChecking=no scripts/bootstrap-server.sh "${DEV_USER}@${DEV_HOST}:/tmp/bootstrap-server.sh"

      - name: Bootstrap remote server
        run: |
          sshpass -p "${DEV_PASSWORD}" ssh -o StrictHostKeyChecking=no "${DEV_USER}@${DEV_HOST}" "chmod +x /tmp/bootstrap-server.sh"
          sshpass -p "${DEV_PASSWORD}" ssh -o StrictHostKeyChecking=no "${DEV_USER}@${DEV_HOST}" "sudo /tmp/bootstrap-server.sh ${DEV_USER} '${DEV_SSH_PUBLIC_KEY}'"
